<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jak and Daxter</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #ccc; font: 13px system-ui, sans-serif; }
  #stage { position: relative; width: 640px; height: 480px; }
  #canvas { display: block; width: 640px; height: 480px; background: #000; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; background: #000; }
  #overlay[hidden] { display: none; }
  #overlay .title { font-size: 26px; color: #e8b04a; letter-spacing: 1px; }
  #overlay-status { color: #999; min-height: 1.2em; }
  #overlay .spinner { width: 28px; height: 28px; border: 3px solid #333; border-top-color: #e8b04a;
                      border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 4px; width: 632px; }
  #bar button { background: #222; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 3px 8px;
                font: inherit; cursor: pointer; }
  #bar button:hover { border-color: #888; }
  #saves, #cache { color: #8a8; }
  #bar .spacer { flex: 1; }
  #log { white-space: pre-wrap; max-height: 40vh; overflow: auto; margin: 0; padding: 4px;
         font: 12px monospace; }
</style>
</head>
<body>
<div id="stage">
  <!-- the runtime transfers this canvas to its main pthread (OffscreenCanvas) -->
  <canvas id="canvas" width="640" height="480" tabindex="-1"></canvas>
  <div id="overlay">
    <div class="title">Jak and Daxter</div>
    <div class="spinner"></div>
    <div id="overlay-status">Starting</div>
  </div>
</div>
<div id="bar">
  <span id="saves">saves: …</span>
  <button id="export" title="Download the saves and settings as a .tar">Export saves</button>
  <button id="import" title="Replace the saves and settings from a .tar (applied on reload)">Import saves</button>
  <input id="importfile" type="file" accept=".tar,application/x-tar" hidden>
  <span class="spacer"></span>
  <span id="cache"></span>
  <button id="logbtn">Log</button>
</div>
<pre id="log" hidden></pre>
<!-- wasm/web/page.js: arguments, log, loading screen, file cache, saves -->
<script src="page.js"></script>
{{{ SCRIPT }}}
</body>
</html>
