<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGOAL Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #ccc; font: 12px monospace; }
  #canvas { display: block; width: 640px; height: 480px; background: #111; }
  #log { white-space: pre-wrap; max-height: 40vh; overflow: auto; margin: 0; padding: 4px; }
</style>
</head>
<body>
<!-- the runtime transfers this canvas to its main pthread (OffscreenCanvas) -->
<canvas id="canvas" width="640" height="480" tabindex="-1"></canvas>
<pre id="log"></pre>
<script>
  // runtime arguments: ?args=-fakeiso+-debug+-nosound (kernel only). Default: boot the game in
  // debug mode (Sandover), with sound.
  const params = new URLSearchParams(location.search);
  const logEl = document.getElementById("log");
  // the whole log (window.gkLog); the page shows its end
  const lines = (window.gkLog = []);
  // WebGL messages are kept apart, the game's log scrolls them away (inspect window.webglLog)
  window.webglLog = [];
  // A pthread's print waits until this thread has handled it (Emscripten proxies stdout writes
  // synchronously), so printing must be cheap: the page is redrawn at most every 100 ms.
  let redraw = null;
  const show = (text) => {
    if (/WebGL/.test(text) && window.webglLog.length < 200) window.webglLog.push(text);
    lines.push(text);
    if (lines.length > 100000) lines.splice(0, 50000);
    redraw ??= setTimeout(() => {
      redraw = null;
      logEl.textContent = lines.slice(-400).join("\n");
      logEl.scrollTop = logEl.scrollHeight;
    }, 100);
  };
  var Module = {
    arguments: (params.get("args") || "-boot -fakeiso -debug").split(" ").filter((a) => a),
    canvas: document.getElementById("canvas"),
    // the game's output stays on the page: the console keeps the browser's own messages (WebGL)
    print: (text) => show(text),
    printErr: (text) => show(text),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
