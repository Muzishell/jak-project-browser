<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGOAL Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #ccc; font: 12px monospace; }
  #canvas { display: block; width: 640px; height: 480px; background: #111; }
  #log { white-space: pre-wrap; max-height: 40vh; overflow: auto; margin: 0; padding: 4px; }
</style>
</head>
<body>
<!-- the runtime transfers this canvas to its main pthread (OffscreenCanvas) -->
<canvas id="canvas" width="640" height="480" tabindex="-1"></canvas>
<pre id="log"></pre>
<script>
  // runtime arguments: ?args=-fakeiso+-debug (default: boot the kernel with the debug flags)
  const params = new URLSearchParams(location.search);
  const logEl = document.getElementById("log");
  const lines = [];
  const show = (text) => {
    lines.push(text);
    if (lines.length > 400) lines.shift();
    logEl.textContent = lines.join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  };
  var Module = {
    arguments: (params.get("args") || "-fakeiso -debug -nosound").split(" ").filter((a) => a),
    canvas: document.getElementById("canvas"),
    print: (text) => { console.log(text); show(text); },
    printErr: (text) => { console.warn(text); show(text); },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
